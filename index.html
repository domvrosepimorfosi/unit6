<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Πακέτο 6: Infographics, Word Clouds, Timelines & Podcasts</title>
    <style>
        body {font-family: 'Comfortaa', sans-serif; background-color: black; color: #fff; text-align: center; margin: 0; padding: 0;}
        h1 {background-color: black; color: gold; padding: 20px; font-size: 25px;}
        .creator, .director {background-color: black; color: gold; padding: 10px; font-size: 18px;}
        .emojis {font-size: 30px; margin-top: 20px;}
        .score-box {position: absolute; top: 20px; right: 20px; font-size: 20px; font-weight: bold;}
        .question-container {margin: 30px; max-width: 800px; margin: auto; text-align: left;}
        .question {margin: 15px 0; padding: 15px; font-size: 120%; background-color: #0b3d91; color: gold; border-radius: 10px; font-weight: bold; text-shadow: 1px 1px 0 rgba(0,0,0,0.8), -1px -1px 0 rgba(255,255,255,0.2);}
        .question-number {text-decoration: underline; display: block; margin-bottom: 5px;}
        .answer {font-size: 18px; margin: 5px 0; padding: 10px; border-radius: 5px; cursor: pointer; background-color: #777; color: white; border: none; width: 100%;}
        .answer:hover {background-color: #999;}
        .correct {background-color: green !important;}
        .incorrect {background-color: red !important;}
        .final-score {font-size: 24px; color: gold; margin-top: 20px;}
    </style>
</head>
<body>
    <div class="creator">Δημιουργία/Επιμέλεια: Παναγιώτης Δόμβρος (CC BY-NC)</div>
    <div class="director">Εκπαιδευτικός Αγγλικών - Θεατρολόγος</div>
    <div class="director">Επιμορφωτής Τ.Π.Ε</div>
    <div class="director">Διευθυντής 1ου Γυμνασίου Πυλαίας</div>
    <h1>Πακέτο 6: Infographics, Word Clouds, Timelines & Podcasts</h1>
    <div class="emojis">📊 ☁️ ⏳ 🎙️</div>
    <div class="score-box">Σκορ: <span id="score">0</span> / 100</div>
    <div class="question-container" id="question-container"></div>
    <audio id="successAudio" src="success-sound.mp3"></audio>
    <audio id="failAudio" src="fail-sound.mp3"></audio>
    <script>
        const questions = [
            {q:'1. Τι ορίζουμε ως infographic;', a:['Α. Κείμενο με υπερσυνδέσμους','Β. Οπτική αναπαράσταση σύνθετων δεδομένων με νόημα','Γ. Ήχο-οπτική παρουσίαση πολυμέσων'], c:1},
            {q:'2. Ποιο από τα παρακάτω <strong>δεν</strong> είναι τύπος infographic;', a:['Α. Ιεραρχικό','Β. Process (διαγράμματα ροής)','Γ. Απεικονιστικό (illustrative)'], c:2},
            {q:'3. Σε ποιο ποσοστό οι άνθρωποι ανταποκρίνονται καλύτερα στην οπτική πληροφορία σε σχέση με τη μονοδιάστατη κειμενική;', a:['Α. 40%','Β. 60%','Γ. 90%'], c:0},
            {q:'4. Τι από τα παρακάτω <strong>δεν</strong> αποτελεί παιδαγωγική χρήση του infographic από τον/την εκπαιδευτικό;', a:['Α. Εξομάλυνση δύσκολης ύλης','Β. Δημιουργία κειμένου-κόμικ','Γ. Οπτικοποίηση διαδικασίας βημάτων'], c:1},
            {q:'5. Ποια αρχή σχεδίασης infographic σχετίζεται με το «αναπνεύσιμο» διάστημα μεταξύ ενοτήτων;', a:['Α. Κοντινή τοποθέτηση','Β. Λευκός χώρος (white space)','Γ. Χρήση έντονης παλέτας'], c:1},
            {q:'6. Ποιο εργαλείο είναι <strong>ειδικά</strong> σχεδιασμένο για τη δημιουργία infographics και προσφέρει έτοιμα templates;', a:['Α. Venngage','Β. Wordle','Γ. Timetoast'], c:0},
            {q:'7. Ποια είναι σωστή δομική σειρά σε ένα infographic;', a:['Α. Τίτλος -- Συμπέρασμα -- Εισαγωγή -- Κυρίως σώμα','Β. Τίτλος -- Εισαγωγή -- Κυρίως σώμα -- Συμπέρασμα','Γ. Εισαγωγή -- Τίτλος -- Κυρίως σώμα -- Συμπέρασμα'], c:1},
            {q:'8. Για ποιον λόγο μπορεί ο εκπαιδευτικός να δημιουργήσει ένα infographic με ελλιπείς πληροφορίες;', a:['Α. Να απαλλάξει τους μαθητές από σκέψη','Β. Να ευαισθητοποιήσει στις βασικές κανόνες οπτικού σχεδιασμού','Γ. Να παρουσιάσει μόνο εικόνες'], c:1},
            {q:'9. Τι εννοούμε με τον όρο «Edugraphics»;', a:['Α. Infographics για επαγγελματίες γραφίστες','Β. Γραφικές οπτικές αναπαραστάσεις εκπαιδευτικού περιεχομένου','Γ. Video-παρουσιάσεις μαθημάτων'], c:1},
            {q:'10. Ποιο από τα παρακάτω <strong>αποτελεί</strong> πλεονέκτημα των infographics στη γλωσσοδιδασκαλία;', a:['Α. Ενισχύουν τον πολυγραμματισμό','Β. Υποβαθμίζουν τον προφορικό λόγο','Γ. Αντικαθιστούν το γραπτό κείμενο ολοκληρωτικά'], c:0},
            {q:'11. Τι απεικονίζει το μέγεθος κάθε λέξης σε ένα συννεφόλεξο;', a:['Α. Το μήκος της λέξης','Β. Τη συχνότητα ή σημασία στο κείμενο','Γ. Την προτεραιότητά της στο λεξιλόγιο'], c:1},
            {q:'12. Ποια παράμετρος <strong>δεν</strong> είναι χαρακτηριστικό σχεδιασμού συννεφόλεξου;', a:['Α. Περιορισμένη περιστροφή ετικετών','Β. Σχήμα ολόκληρου του σύννεφου','Γ. Ενσωμάτωση βίντεο'], c:2},
            {q:'13. Ποιο εργαλείο <strong>δεν</strong> χρησιμοποιείται για word clouds;', a:['Α. EdWordle','Β. Tagxedo','Γ. Glogster'], c:2},
            {q:'14. Πώς μπορούν τα συννεφόλεξα να υποστηρίξουν τη δημιουργική γραφή των μαθητών;', a:['Α. Αναγκάζοντάς τους να γράψουν μια έκθεση','Β. Παρουσιάζοντας τις συχνότερες λέξεις-κλειδιά για έμπνευση','Γ. Αφαιρώντας τα κλειδιά λέξεων'], c:1},
            {q:'15. Ποιο πλεονέκτημα έχουν τα συννεφόλεξα για visual learners;', a:['Α. Παρέχουν ηχητική ανάδραση','Β. Οπτικοποιούν συστηματικά τη συχνότητα των λέξεων','Γ. Απαιτούν ειδικό λογισμικό'], c:1},
            {q:'16. Σε ποια δραστηριότητα οι μαθητές κολλούν το γραπτό τους σε πρόγραμμα word cloud για αυτοδιόρθωση;', a:['Α. Συγγραφή ποιήματος','Β. Έλεγχο επανάληψης λέξεων και αντικατάσταση με συνώνυμα','Γ. Δημιουργία διαγράμματος ροής'], c:1},
            {q:'17. Ποια χρήση <strong>δεν</strong> ανήκει στις ιδέες αξιοποίησης word clouds;', a:['Α. Διαμορφωτική ανατροφοδότηση','Β. Δημιουργία interactive quiz','Γ. Εξάσκηση μνήμης περιλήψεων'], c:1},
            {q:'18. Τι μπορεί να δείξει το word cloud ενός κειμένου πριν κι ενός μετά την επεξεργασία;', a:['Α. Την αλλαγή θεματικής κατεύθυνσης','Β. Τη βελτίωση στη χρήση ποικιλίας λέξεων','Γ. Την ορθογραφική ακρίβεια'], c:1},
            {q:'19. Για ποιο σκοπό χρησιμοποιούμε word clouds ως διαγνωστικό εργαλείο;', a:['Α. Να μετρήσουμε τον χρόνο ανάγνωσης','Β. Να εντοπίσουμε κύριες θεματικές ενός μεγάλου σώματος κειμένου','Γ. Να δημιουργήσουμε quiz πολλαπλής επιλογής'], c:1},
            {q:'20. Ποιο από τα παρακάτω <strong>αντιστοιχεί</strong> σε εργαλείο με animation λέξεων και υπερσυνδέσμους;', a:['Α. WordArt (Tagul)','Β. Timetoast','Γ. Prezi'], c:0},
            {q:'21. Τι είναι η διαδραστική αφίσα (Glog);', a:['Α. Στατικό infographic σε PDF','Β. Πολυμεσική αφίσα με κείμενο, εικόνα, ήχο, βίντεο','Γ. Χρονικό βίντεο παρουσίασης'], c:1},
            {q:'22. Σε ποια διδακτική χρήση <strong>έχει έμφαση</strong> η διαδραστική αφίσα;', a:['Α. Επανάληψη γραμματικής','Β. Ομαδικές παρουσιάσεις projects','Γ. Αυτόματη διόρθωση ασκήσεων'], c:1},
            {q:'23. Ποιο στοιχείο <strong>δεν</strong> μπορεί να ενσωματωθεί σε Glog;', a:['Α. Κουίζ πολλαπλής επιλογής','Β. Υπερσύνδεσμος','Γ. Διαδραστικό χάρτη'], c:0},
            {q:'24. Ποια εργασία ΔΕΝ περιλαμβάνεται ως ιδέα για τους μαθητές με Glog;', a:['Α. Παρουσίαση προσώπου/τόπου','Β. Δημιουργία flowchart διαδικασίας','Γ. Περιγραφή βιογραφικού'], c:1},
            {q:'25. Ποιο από τα παρακάτω <strong>δεν</strong> είναι πλεονέκτημα των διαδραστικών αφισών;', a:['Α. Ευνοούν τον πολυμεσικό γραμματισμό','Β. Απαλλάσσουν πλήρως τον μαθητή από τη δημιουργία περιεχομένου','Γ. Υποστηρίζουν την ομαδική συνεργασία'], c:1},
            {q:'26. Ποιος είναι βασικός στόχος του Glog στην ξενόγλωσση τάξη;', a:['Α. Μόνο η κατανόηση ακρόασης','Β. Η ενσωμάτωση διαφορετικών μέσων σε μία αφίσα','Γ. Η δημιουργία στατικών χαρτών'], c:1},
            {q:'27. Ποιο εργαλείο <strong>χρησιμοποιείται</strong> για τη δημιουργία Glog;', a:['Α. Canva','Β. Preceden','Γ. WordItOut'], c:0},
            {q:'28. Τι <strong>πρέπει</strong> να προσέξει ο μαθητής στη δημιουργία Glog;', a:['Α. Να μην προσθέσει κείμενο','Β. Τη σαφήνεια κατευθυντηρίων σημειώσεων (arrows, labels)','Γ. Να χρησιμοποιήσει πάνω από 10 χρώματα'], c:1},
            {q:'29. Σε ποιο στάδιο του μαθήματος μπορεί να εισαχθεί το Glog;', a:['Α. Ως έναυσμα εισαγωγής νέας ενότητας','Β. Μόνο στην αξιολόγηση τελικής εργασίας','Γ. Μόνο σε ασκήσεις γραμματικής'], c:0},
            {q:'30. Ποιος τύπος δραστηριότητας ΔΕΝ ταιριάζει με τη χρήση Glog;', a:['Α. Παρουσίαση ομάδας για σχολική εκδρομή','Β. Δημιουργία podcast','Γ. Παρουσίαση έργου τέχνης'], c:1},
            {q:'31. Τι <strong>διακρίνει</strong> τη χρονογραμμή από το process infographic;', a:['Α. Η χρονογραμμή βασίζεται σε χάρτες','Β. Η χρονογραμμή οργανώνει γεγονότα κατά σειρά χρόνου','Γ. Το process infographic είναι πάντα στατικό'], c:1},
            {q:'32. Ποιο εργαλείο ΔΕΝ είναι για χρονογραμμές;', a:['Α. Timetoast','Β. Tagxedo','Γ. Sutori'], c:1},
            {q:'33. Ποια δυνατότητα <strong>δεν</strong> προσφέρει το Preceden στην ελεύθερη έκδοση;', a:['Α. Δημιουργία layers (στρώματα)','Β. Προσθήκη περισσότερων από 10 γεγονότων','Γ. Πολυμεσικό περιεχόμενο σε γεγονότα'], c:1},
            {q:'34. Σε ποιο format εισάγουμε τις ημερομηνίες στο Timetoast;', a:['Α. Έτος-μήνας-ημέρα','Β. Ημέρα/Μήνας/Έτος','Γ. Μήνας-ημέρα-έτος'], c:1},
            {q:'35. Ποιο εργαλείο είναι open-source και βασίζεται σε Google Sheets;', a:['Α. TimelineJS','Β. Prezi','Γ. WordArt'], c:0},
            {q:'36. Ποια χρήση <strong>δεν</strong> ανήκει στις χρονογραμμές των μαθητών;', a:['Α. Ιστορική εμβάθυνση βιογραφίας','Β. Οπτικοποίηση λεξιλογίου','Γ. Σύγκριση φαινομένων'], c:1},
            {q:'37. Σε τι συμβάλλει το επίπεδο layering στο Preceden;', a:['Α. Στο ξεχωριστό στυλ χρωμάτων','Β. Στην οργάνωση θεματικών στρωμάτων γεγονότων','Γ. Στη μετατροπή σε PDF'], c:1},
            {q:'38. Ποια από τις παρακάτω <strong>δεν</strong> είναι προβολή του Timetoast;', a:['Α. Λίστα','Β. Timeline','Γ. Γκάλερι εικόνων'], c:2},
            {q:'39. Τι επιτρέπει το Sutori πέρα από timeline;', a:['Α. Ενσωμάτωση κουίζ πολλαπλής επιλογής','Β. Δημιουργία word clouds','Γ. Επεξεργασία PDF'], c:0},
            {q:'40. Για ποιο λόγο ένας εκπαιδευτικός μπορεί να επιλέξει TimelineJS;', a:['Α. Χρειάζεται ειδικό λογισμικό','Β. Είναι ανοικτού κώδικα και εύκολο στο sharing','Γ. ΔΕΝ υποστηρίζει πολυμέσα'], c:1},
            {q:'41. Ποια βασική διαφορά υπάρχει μεταξύ podcast και vodcast;', a:['Α. Ήχος vs βίντεο','Β. Γλώσσα εκφώνησης','Γ. Διάρκεια επεισοδίου'], c:0},
            {q:'42. Ποια χρήση ΔΕΝ ανήκει στα podcasts στη διδασκαλία ξένης γλώσσας;', a:['Α. Ασκηση ακουστικής κατανόησης','Β. Δημιουργία διαδραστικών αφισών','Γ. Έργα έρευνας'], c:1},
            {q:'43. Ποιο στοιχείο <strong>δεν</strong> είναι απαραίτητο σε vodcast;', a:['Α. Βίντεο','Β. Ήχος','Γ. Υπερσύνδεσμος'], c:2},
            {q:'44. Τι κερδίζουν οι μαθητές από την παραγωγή δικού τους podcast;', a:['Α. Παραγωγή προφορικού λόγου','Β. Μόνο γραπτή έκφραση','Γ. Αυτοματοποιημένη διόρθωση'], c:0},
            {q:'45. Ποιο εργαλείο μπορεί να χρησιμοποιηθεί για την παραγωγή vodcast;', a:['Α. Audacity (ήχο) + πρόγραμμα εγγραφής βίντεο','Β. WordItOut','Γ. Preceden'], c:0},
            {q:'46. Ποια δραστηριότητα ΔΕΝ ταιριάζει με podcast/vodcast;', a:['Α. Συνέντευξη επισκέπτη','Β. Παρουσίαση slideshow','Γ. Δημιουργία word cloud'], c:2},
            {q:'47. Για ποιο λόγο ένα vodcast υποστηρίζει καλύτερα το multimodal γραμματισμό;', a:['Α. Συνδυάζει ήχο, εικόνα, κείμενο','Β. Είναι πάντα γραμμικά δομημένο','Γ. Αποκλείει την ομαδική εργασία'], c:0},
            {q:'48. Σε ποιο στάδιο του μαθήματος μπορεί να χρησιμοποιηθεί podcast ως προετοιμασία;', a:['Α. Πριν την εξέταση για επανάληψη','Β. Μόνο στην αξιολόγηση','Γ. Μόνο ως διακοσμητικό στοιχείο'], c:0},
            {q:'49. Τι είδους δραστηριότητα μπορεί να συνδυάσει και podcast και infographic;', a:['Α. Διάλογο προφορικού λόγου μόνο','Β. Οπτική σύνοψη ενός ηχητικού επεισοδίου','Γ. Λέξεις-κλειδιά σε word cloud μόνο'], c:1},
            {q:'50. Ποιο από τα παρακάτω <strong>δεν</strong> είναι στόχος της χρήσης vodcast από μαθητές;', a:['Α. Ανάπτυξη ψηφιακών δεξιοτήτων παραγωγής βίντεο','Β. Μόνο ακρόαση χωρίς δημιουργία','Γ. Κριτική ανάλυση περιεχομένου'], c:1}
        ];
        let score=0, idx=0;
        const container=document.getElementById('question-container');
        function showQuestion(){
            if(idx>=questions.length){
                container.innerHTML=`<div class="final-score">Τέλος! Σκορ: ${score} / ${questions.length*2}</div>`;
                return;
            }
            const {q,a} = questions[idx];
            let html=`<div class="question"><span class="question-number">Ερώτηση ${idx+1}:</span>${q}</div>`;
            a.forEach((opt,i)=>{ html+=`<button class="answer" data-index="${i}">${opt}</button>`; });
            container.innerHTML=html;
            document.querySelectorAll('.answer').forEach(btn=>btn.addEventListener('click',onAnswer));
        }
        function onAnswer(e){
            const selected=+e.currentTarget.dataset.index;
            const {c}=questions[idx];
            const audio=selected===c?document.getElementById('successAudio'):document.getElementById('failAudio');
            audio.play();
            if(selected===c) score+=2;
            document.getElementById('score').textContent=score;
            document.querySelectorAll('.answer').forEach((btn,i)=>{ btn.disabled=true; if(i===c) btn.classList.add('correct'); else if(i===selected) btn.classList.add('incorrect'); });
            idx++;
            setTimeout(showQuestion,800);
        }
        showQuestion();
    </script>
</body>
</html>
